<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>기물 전시</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#15110e;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
import { createPieceKit } from './pieces.js';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b1511);
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.7;
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
const q = new URLSearchParams(location.search);
const only = q.get('only');
cam.position.set(0, 2.6, 11.5);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 0.85, 0); ctl.enableDamping = true;
const sun = new THREE.DirectionalLight(0xfff0dd, 2.6); sun.position.set(-4, 9, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x6b4a30, roughness: 0.5 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const kit = createPieceKit();
const order = [1, 2, 3, 4, 5, 6];
window.kit = kit; window.scene = scene; window.THREE = THREE; window.ctl = ctl; window.cam = cam;
order.forEach((t, i) => {
  if (only && +only !== t) return;
  [0, 1].forEach((c) => {
    const p = kit.create(t, c);
    p.position.set(only ? (c ? 1 : -1) : (i - 2.5) * 1.35, 0, c ? -1.3 : 1.0);
    scene.add(p);
  });
});
if (only) { cam.position.set(0, 1.6, 4.2); ctl.target.set(0, 0.8, 0); }
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
window.__ready = true;
</script></body></html>
